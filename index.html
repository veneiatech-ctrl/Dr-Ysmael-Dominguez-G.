<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro Clínico de los Dientes | Dr. Ysmael Domínguez G.</title>
<meta name="description" content="Tarjeta digital del Dr. Ysmael Domínguez G., Cirujano Dental – Odontólogo. Centro Clínico de los Dientes, Monagas, Venezuela.">
<meta name="theme-color" content="#071D29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --petroleo:#0B2C3D;
  --petroleo-hondo:#061922;
  --foco:#2A6378;
  --oro:#CFAE6B;
  --oro-claro:#EBD3A0;
  --marfil:#F4EFE6;
  --bruma:#A8C2CB;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  /* Cuando llegue la foto del consultorio: --foto: url("data:image/jpeg;base64,...") */
  --foto:none;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  height:100%;
  background:#03110A;
  background:radial-gradient(120% 90% at 50% 0%,#0E3446 0%,#04141C 60%,#020B10 100%);
  color:var(--marfil);
  font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- Tarjeta ---------- */
.card{
  position:relative;
  width:min(430px,100%);
  height:min(880px,calc(100% - 48px));
  border-radius:30px;
  overflow:hidden;
  isolation:isolate;
  background:var(--petroleo-hondo);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(207,174,107,.28),inset 0 1px 0 rgba(255,255,255,.06);
}
@media (max-width:520px){
  body{background:var(--petroleo-hondo)}
  .card{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* Fondo: foto del consultorio difuminada + azul petróleo + foco de vitrina */
.bg-photo{position:absolute;inset:-30px;background:var(--foto) center/cover no-repeat;filter:blur(14px) saturate(.7);opacity:.35;z-index:-3}
.bg{
  position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(70% 36% at 50% 33%,rgba(64,140,165,.55) 0%,rgba(42,99,120,.22) 45%,rgba(11,44,61,0) 75%),
    linear-gradient(180deg,rgba(11,44,61,.86) 0%,rgba(8,34,47,.92) 55%,rgba(5,22,31,.97) 100%);
}
.bg::after{ /* haz del foco desde arriba */
  content:"";position:absolute;left:50%;top:-10%;width:120%;height:70%;transform:translateX(-50%);
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(235,211,160,.07) 172deg,rgba(255,255,255,.10) 180deg,rgba(235,211,160,.07) 188deg,transparent 200deg);
  filter:blur(6px);
}
.frame{ /* filete dorado interior */
  position:absolute;inset:14px;border-radius:22px;z-index:-1;pointer-events:none;
  border:1px solid rgba(207,174,107,.22);
}
@media (max-width:520px){.frame{border-radius:18px}}

.cover{
  height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(28px,6vh,48px) 30px clamp(26px,5vh,40px);
  text-align:center;
  transition:opacity .6s ease,transform .7s cubic-bezier(.6,0,.2,1);
}

/* Emblema */
.emblem{display:flex;align-items:center;gap:12px;color:var(--oro);font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.32em;padding-left:.32em}
.emblem::before,.emblem::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--oro))}
.emblem::after{transform:scaleX(-1)}

/* Escenario del diente */
.stage{position:relative;flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.figure{position:relative;width:min(340px,88%);perspective:1100px}
.float{position:relative;width:100%;animation:flotar 5.5s ease-in-out infinite}
.tooth{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
.shadow{
  position:absolute;left:50%;bottom:-6px;
  width:66%;height:22px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));
  animation:sombra 5.5s ease-in-out infinite;
}
.sweep{animation:destello 6s ease-in-out infinite 1.2s;transform:translateX(0)}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes sombra{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(.82);opacity:.6}}
@keyframes destello{0%{transform:translateX(0)}32%,100%{transform:translateX(2900px)}}

/* Chispas */
.spark{position:absolute;width:var(--s,14px);aspect-ratio:1;color:var(--oro-claro);opacity:0;animation:titilar 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.spark svg{width:100%;height:100%;display:block}
@keyframes titilar{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9}}

/* Textos */
.clinic{font-family:var(--serif);font-weight:600;font-size:clamp(30px,8.4vw,36px);line-height:1.04;letter-spacing:.005em;color:var(--marfil);text-wrap:balance}
.rule{width:64px;height:1px;margin:16px auto 14px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.doctor{font-weight:600;font-size:17px;letter-spacing:.01em;color:var(--marfil)}
.role{margin-top:4px;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--bruma)}
.creds{margin-top:12px;display:inline-flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.06em;color:rgba(168,194,203,.75)}
.creds i{width:3px;height:3px;border-radius:50%;background:var(--oro);opacity:.8}

/* Acciones */
.actions{margin-top:clamp(20px,4vh,30px);display:flex;align-items:center;gap:14px}
.btn-enter{
  appearance:none;border:0;cursor:pointer;
  font:600 16px/1 var(--sans);letter-spacing:.06em;color:#2A1E07;
  padding:17px 46px;border-radius:999px;
  background:linear-gradient(180deg,#F0DAA6 0%,#D6B573 48%,#B8934D 100%);
  box-shadow:0 10px 26px -8px rgba(207,174,107,.55),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.18);
  position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn-enter::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:boton 4.5s ease-in-out infinite 2s}
@keyframes boton{0%{transform:translateX(-120%)}25%,100%{transform:translateX(120%)}}
.btn-enter:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(207,174,107,.65),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-wa{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  color:var(--oro-claro);border:1px solid rgba(207,174,107,.45);background:rgba(255,255,255,.03);
  transition:background .2s ease,border-color .2s ease;
}
.btn-wa:hover{background:rgba(207,174,107,.12);border-color:var(--oro)}
.btn-wa svg{width:24px;height:24px}
.btn-enter:focus-visible,.btn-wa:focus-visible{outline:2px solid var(--oro-claro);outline-offset:4px}

.place{margin-top:16px;font-size:12px;color:rgba(168,194,203,.6);letter-spacing:.04em}

/* Animación al entrar */
.card.entering .float{animation:saludoGiro 2s cubic-bezier(.45,.05,.35,1) forwards;transform-style:preserve-3d}
.card.entering .shadow{animation:sombraGiro 2s ease-in-out forwards}
.card.entering .spark{animation:none;opacity:0;transition:opacity .3s}
.card.entering .burst{animation:estallido .8s ease-out 1.55s forwards}
.card.leaving .cover{opacity:0;transform:scale(1.04);transition:opacity .45s ease,transform .45s ease}
.veil{position:absolute;inset:0;background:var(--petroleo-hondo);opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:5}
.card.leaving .veil{opacity:1}
.card.inside .cover{opacity:0;transform:scale(.94) translateY(-14px);pointer-events:none}
@keyframes saludoGiro{
  0%  {transform:translateY(0)     rotate(0)     scale(1)    rotateY(0)}
  13% {transform:translateY(-24px) rotate(-7deg) scale(1.05) rotateY(0)}
  26% {transform:translateY(-8px)  rotate(4deg)  scale(1.03) rotateY(0)}
  34% {transform:translateY(-14px) rotate(0)     scale(1.04) rotateY(0)}
  82% {transform:translateY(-18px) rotate(0)     scale(1.10) rotateY(360deg)}
  100%{transform:translateY(-18px) rotate(0)     scale(1.14) rotateY(360deg)}
}
@keyframes sombraGiro{0%{transform:translateX(-50%) scale(1);opacity:.9}34%{transform:translateX(-50%) scale(.8);opacity:.6}58%{transform:translateX(-50%) scale(.35,.8);opacity:.45}82%,100%{transform:translateX(-50%) scale(.85);opacity:.6}}
.burst{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,244,214,.9),rgba(235,211,160,.35) 40%,transparent 70%);pointer-events:none}
@keyframes estallido{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(60);opacity:0}}


@media (max-height:640px){.figure{width:min(210px,58%)}.clinic{font-size:28px}.rule{margin:10px auto}}
@media (prefers-reduced-motion:reduce){
  .card.entering .float{animation:none!important}
  .float,.shadow,.sweep,.spark,.btn-enter::after{animation:none!important}
  .spark{opacity:.7}
}
</style>
</head>
